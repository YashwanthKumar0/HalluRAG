# Hallucination-Aware RAG Configuration

# Data settings
data:
  # arXiv categories to download (cs.CL, cs.AI)
  categories:
    - "cs.CL"
    - "cs.AI"
  # Maximum number of papers to download per category
  max_papers_per_category: 100
  # Date range for papers (YYYY-MM-DD)
  date_from: "2023-01-01"
  date_to: "2024-12-31"
  # Paths
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  chunks_dir: "data/chunks"
  index_dir: "data/index"
  gold_dir: "data/gold"

# Chunking settings
chunking:
  # Fixed chunking
  fixed:
    chunk_size: 512
    chunk_overlap: 50
  # Semantic chunking
  semantic:
    min_chunk_size: 100
    max_chunk_size: 512
    similarity_threshold: 0.75
  # Embedding model for semantic chunking
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

# Retrieval settings
retrieval:
  # Dense retrieval
  dense:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    top_k: 20
  # Hybrid retrieval (BM25 + dense)
  hybrid:
    bm25_weight: 0.5
    dense_weight: 0.5
    top_k: 20
  # Cross-encoder reranking
  rerank:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5

# Generation settings
generation:
  # Local model (using transformers) - set to null to use API
  local_model: "microsoft/Phi-3-mini-4k-instruct"
  # Generation parameters
  max_new_tokens: 512
  temperature: 0.3
  top_p: 0.9
  # System prompt
  system_prompt: |
    You are a helpful research assistant. Answer the question using ONLY the provided context.
    Cite your sources inline using square brackets with the chunk ID, e.g., [C1], [C2].
    If the context doesn't contain enough information, say so.

# Faithfulness verification settings
faithfulness:
  # NLI model for claim verification
  nli_model: "microsoft/deberta-v3-base-mnli"
  # Labels: 0=entailment, 1=neutral, 2=contradiction
  entailment_label: 0
  neutral_label: 1
  contradiction_label: 2
  # Confidence threshold
  confidence_threshold: 0.5

# Evaluation settings
evaluation:
  # Gold Q&A set
  gold_qa_path: "data/gold/gold_qa.jsonl"
  human_labels_path: "data/gold/human_labels.jsonl"
  # Metrics to compute
  metrics:
    - recall_at_k
    - mrr
    - faithfulness
    - answer_relevance
    - human_agreement
  # k values for recall
  recall_k_values: [1, 3, 5, 10]
  # Experiment configurations to compare
  experiments:
    chunking_strategies: ["fixed", "semantic"]
    retrieval_types: ["dense", "hybrid"]
    rerank_options: [false, true]

# Streamlit app settings
app:
  host: "0.0.0.0"
  port: 8501
  title: "Hallucination-Aware RAG"
  description: "RAG with faithfulness verification for arXiv papers"

# Device settings (auto-detected if not specified)
device:
  # "cuda", "mps", "cpu", or "auto"
  type: "auto"