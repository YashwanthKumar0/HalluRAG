data:
  categories: ["cs.CL", "cs.AI"]
  max_papers: 600
  year_min: 2022
  raw_dir: data/raw
  processed_dir: data/processed
  chunks_dir: data/chunks
  index_dir: data/index
  gold_dir: data/gold
  results_dir: results
  keywords:
    - "retrieval"
    - "hallucination"
    - "question answering"
    - "language model"
    - "RAG"
    - "factual"
    - "faithfulness"
    - "grounded"

chunking:
  fixed:
    chunk_tokens: 512
    overlap_tokens: 50
  semantic:
    max_tokens: 512
    min_tokens: 80
  tokenizer: BAAI/bge-small-en-v1.5
  min_words: 40
  min_alpha_ratio: 0.6

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  normalize: true

retrieval:
  top_k: 5
  candidate_k: 20
  rrf_k: 60

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

generation:
  provider: openai_compatible
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  model_env: LLM_MODEL
  temperature: 0.1
  max_tokens: 3000
  max_context_tokens: 6000
  timeout: 180

faithfulness:
  nli_model: cross-encoder/nli-deberta-v3-small
  # Faster CPU alternative: cross-encoder/nli-deberta-v3-xsmall
  # Labels are read from the model id2label mapping.
  window_sentences: 3
  window_stride: 1
  entail_threshold: 0.5
  contradict_threshold: 0.5
  max_premise_tokens: 400
  top_windows: 5

experiment:
  chunking: [fixed, semantic]
  retrieval: [dense, hybrid]
  rerank: [false, true]
  recall_ks: [1, 3, 5, 10]